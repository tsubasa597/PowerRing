# HyperX Cloud Flight（天箭）无线耳机
#
# 这是第二份声明，也是第一份**非 HID++** 的声明 —— 用来验证「加设备 = 填表格」
# 这条承诺在非罗技设备上也成立：整个文件里没有一行 Rust 代码被改动。
#
# 协议常量属事实信息，来源见 protocol_source。本项目未复制其任何源码。

name: "HyperX Cloud Flight"

# raw = 原始报文：请求/响应都是裸字节，格式写在本文件里。
# 与罗技的差别在于它没有「feature 号 + 函数号」那套统一寻址，
# 各家报文各不相同，所以把「发什么、读哪几个字节、怎么换算」都声明化
protocol: "raw"
# 接收器已与耳机配对成一台设备，命令直接发，不用按 slot 寻址
transport: "direct"

match:
  vendor_id: "0x0951"      # Kingston / HyperX
  product_id: "0x1723"     # Cloud Flight 的无线接收器
  usage_page: "0xFF90"     # 只有这个 vendor collection 会回应电量请求
  usage: "0x0303"

battery:
  # 请求报文（首字节是 report id）。实测必须按 20 字节发，短了设备不回
  request: "21 FF 05"
  reply_len: 20
  # 响应形如 21 FF 05 <档位> <数值> 00 ...
  state_index: 3           # 档位字节：决定下面那张表用哪一组
  value_index: 4           # 数值字节
  # 档位取这两个值时表示正在充电（数值字节此时不代表电量）
  charging_states: ["0x10", "0x11"]
  # 分段映射表：数值落在哪一段就取对应的百分比。
  # 用分段而不是公式 —— 实测数值与百分比不是线性关系，
  # 线性拟合在高电量段会差出十几个百分点
  table:
    "0x0e":                # 数值 250..90，大致对应 65% ~ 10%
      - [89, 10]
      - [119, 15]
      - [148, 20]
      - [159, 25]
      - [169, 30]
      - [179, 35]
      - [189, 40]
      - [199, 45]
      - [209, 50]
      - [219, 55]
      - [239, 60]
      - [255, 65]
    "0x0f":                # 数值 130..0，大致对应 100% ~ 70%
      - [19, 70]
      - [49, 75]
      - [69, 80]
      - [99, 85]
      - [119, 90]
      - [129, 95]
      - [255, 100]

protocol_source: "HyperX Cloud Flight 电量报文常量，参考 kondinskis/hyperx-cloud-flight（MIT）公开仓库"
verification: "verified"

notes: >
  接收器暴露 4 个接口，只有 usage_page 0xFF90 / usage 0x0303 会回应电量请求，
  其余三个（000C:0001 / FF00:0001 / FFC0:0001）发了也没反应 —— 探测时别只试一个。
  请求必须补齐到 20 字节（实测与罗技长报文一样对长度敏感）。
  耳机没开机时探测无响应，扫描会正确地把它排除，而不是显示 0%。
  实测读数：档位 0x0E、数值 231 → 60%。

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 打包 exe 并发布 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release 构建
        run: cargo build --release

      # 解压即用的目录必须保持 exe 与 devices 平级 ——
      # 程序是按 exe 所在位置去找设备声明的，散着放会一台设备都扫不到
      - name: 打包 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PowerRing | Out-Null
          Copy-Item target/release/powerring.exe dist/PowerRing/
          Copy-Item devices dist/PowerRing/devices -Recurse
          Copy-Item README.md, README.en.md, LICENSE dist/PowerRing/
          $name = "PowerRing-$($env:GITHUB_REF_NAME)-windows-x64.zip"
          Compress-Archive -Path dist/PowerRing/* -DestinationPath $name
          Write-Host "打包完成：$name"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "产出 $name"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: PowerRing-*.zip

[package]
name = "power-ring"
version = "0.1.0"
edition = "2021"
description = "Windows 无线外设电量监测工具（托盘电量环）"
license = "MIT"
repository = "https://github.com/vkeyzhen/PowerRing"

[[bin]]
name = "powerring"
path = "src/main.rs"

[dependencies]
hidapi = "2"
tray-icon = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",

]

# release 档：体积不再是最优目标，编译速度与可调试性优先
# 决策依据（2026-10-20）：本项目反馈循环慢才是最大成本，为省几 MB 换数倍编译时间不划算
[profile.release]
opt-level = "s"      # 体积与速度的平衡点，比 3 略小、比 "z" 快得多
lto = "thin"         # 增量友好的链接时优化，避免 fat LTO 拖慢每次构建
codegen-units = 16   # 保持并行编译
strip = true         # 剥离符号（几乎无代价，照做）

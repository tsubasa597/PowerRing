[package]
name = "power-ring"
version = "0.1.0"
edition = "2021"
description = "Windows 无线外设电量监测工具（托盘电量环）"
license = "MIT"
repository = "https://github.com/vkeyzhen/PowerRing"

[[bin]]
name = "powerring"
path = "src/main.rs"

[dependencies]
hidapi = "2"
tray-icon = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # M2：开机自启（写 HKCU Run 键）+ 单实例保护（命名互斥量）
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    # M2：深色主题下把窗口标题栏也变深（DWM 属性）
    "Win32_Graphics_Dwm",
    # M2：系统通知（进通知中心）。Toast 是 WinRT 接口，XML 要用 XmlDocument 拼
    # Toast 是 WinRT 接口，走的是 WinRT 那棵命名空间：feature 名**不带** Win32_ 前缀
    # （Win32_UI_Notifications 是另一回事 —— 那是 Shell 的老式通知区 API）
    "UI_Notifications",
    "Data_Xml_Dom",
    # 上面两个依赖 COM 初始化；快捷方式（通知中心认人的凭据）也走 COM
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    # PROPVARIANT 被 feature 门在这个模块里，写快捷方式的 AUMID 属性要用
    "Win32_System_Variant",
]

# release 档：体积不再是最优目标，编译速度与可调试性优先
# 决策依据（2026-10-20）：本项目反馈循环慢才是最大成本，为省几 MB 换数倍编译时间不划算
[profile.release]
opt-level = "s"      # 体积与速度的平衡点，比 3 略小、比 "z" 快得多
lto = "thin"         # 增量友好的链接时优化，避免 fat LTO 拖慢每次构建
codegen-units = 16   # 保持并行编译
strip = true         # 剥离符号（几乎无代价，照做）
